global:
  edition: ce

  hosts:
    domain: gitlab.local.com
    externalIP: "${EXTERNAL_IP}"
    https: false

  ingress:
    enabled: true
    class: azure-application-gateway
    configureCertmanager: false

  minio:
    enabled: false

  psql:
    host: gitlab-postgres.postgres.database.azure.com
    port: 5432
    username: gitlabadmin
    database: gitlabhq_production
    password:
      secret: gitlab-postgres-secret
      key: password

  redis:
    host: gitlab-redis-aks-001.redis.cache.windows.net
    port: 6380
    scheme: rediss
    password:
      secret: gitlab-redis-secret
      key: password

  appConfig:
    object_store:
      enabled: true
      connection:
        secret: gitlab-storage-secret
        key: connection

    backups:
      bucket: gitlab-backups
      tmpBucket: gitlab-tmp

certmanager:
  install: false
  installCRDs: false

certmanager-issuer:
  enabled: false

postgresql:
  install: false

redis:
  install: false

nginx-ingress:
  enabled: false

prometheus:
  install: false

grafana:
  enabled: false

registry:
  enabled: false

gitlab-runner:
  enabled: false

gitlab:
  webservice:
    ingress:
      enabled: true

  sidekiq:
    enabled: true

  toolbox:
    enabled: true

    backups:
      objectStorage:
        backend: azureRM

  kas:
    enabled: false

  gitaly:
    persistence:
      enabled: true
      size: 20Gi

  gitlab-shell:
    service:
      type: ClusterIP

  migrations:
    enabled: true

  task-runner:
    enabled: true