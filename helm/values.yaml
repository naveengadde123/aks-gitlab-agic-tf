global:
  edition: ce

  hosts:
    domain: nip.io
    https: false

  ingress:
    class: azure-application-gateway
    configureCertmanager: false

  minio:
    enabled: false

  psql:
    host: gitlab-postgres.postgres.database.azure.com
    port: 5432
    username: gitlabadmin
    database: gitlabhq_production
    password:
      secret: gitlab-postgres-secret
      key: password

  redis:
    host: gitlab-redis-aks.redis.cache.windows.net
    port: 6380
    scheme: rediss
    password:
      secret: gitlab-redis-secret
      key: password

postgresql:
  install: false

redis:
  install: false

nginx-ingress:
  enabled: false

certmanager:
  install: false
  enabled: false

prometheus:
  install: false

grafana:
  enabled: false

registry:
  enabled: false

gitlab-runner:
  install: false

gitlab-exporter:
  enabled: false

gitlab:
  kas:
    enabled: false

  webservice:
    ingress:
      enabled: false

    minReplicas: 1
    maxReplicas: 1

  sidekiq:
    replicas: 1

  gitlab-shell:
    replicas: 1

  toolbox:
    replicas: 1