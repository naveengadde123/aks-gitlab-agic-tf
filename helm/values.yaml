global:
  edition: ce

  hosts:
    domain: gitlab.local.com
    https: false

  ingress:
    class: azure-application-gateway
    configureCertmanager: false

  minio:
    enabled: false

  psql:
    host: gitlab-postgres.postgres.database.azure.com
    port: 5432
    username: gitlabadmin
    database: gitlabhq_production
    password:
      secret: gitlab-postgres-secret
      key: password

  redis:
    host: gitlab-redis-aks-001.redis.cache.windows.net
    port: 6380
    scheme: rediss

  appConfig:
    object_store:
      enabled: true
      connection:
        secret: gitlab-storage-secret
        key: connection

certmanager-issuer:
  enabled: false
  email: admin@gitlab.local.com

postgresql:
  install: false

redis:
  install: false

nginx-ingress:
  enabled: false

prometheus:
  enabled: false

grafana:
  enabled: false

gitlab-runner:
  enabled: false

registry:
  enabled: false

gitlab:
  kas:
    enabled: false

  toolbox:
    backups:
      objectStorage:
        backend: azureRM

  redis:
    password:
      secret: gitlab-redis-secret
      key: password