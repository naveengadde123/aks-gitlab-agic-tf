name: Deploy AKS + GitLab

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Azure Login
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v2

      - name: Terraform Init
        working-directory: terraform
        run: terraform init

      - name: Terraform Apply
        working-directory: terraform
        run: terraform apply -auto-approve

      - name: Get AKS Credentials
        run: |
          az aks get-credentials \
            --resource-group rg-gitlab \
            --name aks-gitlab-eip \
            --overwrite-existing

      - name: Verify AKS Cluster
        run: |
          kubectl cluster-info
          kubectl get nodes

      - name: Create Namespace
        run: |
          kubectl create namespace gitlab \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Fetch Azure Resource Details
        run: |
          POSTGRES_HOST=$(az postgres flexible-server list \
            --resource-group rg-gitlab \
            --query "[0].fullyQualifiedDomainName" -o tsv)

          REDIS_HOST=$(az redis list \
            --resource-group rg-gitlab \
            --query "[0].hostName" -o tsv)

          REDIS_NAME=$(az redis list \
            --resource-group rg-gitlab \
            --query "[0].name" -o tsv)

          REDIS_KEY=$(az redis list-keys \
            --name $REDIS_NAME \
            --resource-group rg-gitlab \
            --query "primaryKey" -o tsv)

          STORAGE_ACCOUNT=$(az storage account list \
            --resource-group rg-gitlab \
            --query "[0].name" -o tsv)

          STORAGE_KEY=$(az storage account keys list \
            --account-name $STORAGE_ACCOUNT \
            --resource-group rg-gitlab \
            --query "[0].value" -o tsv)

          echo "POSTGRES_HOST=$POSTGRES_HOST" >> $GITHUB_ENV
          echo "REDIS_HOST=$REDIS_HOST" >> $GITHUB_ENV
          echo "REDIS_KEY=$REDIS_KEY" >> $GITHUB_ENV
          echo "STORAGE_ACCOUNT=$STORAGE_ACCOUNT" >> $GITHUB_ENV
          echo "STORAGE_KEY=$STORAGE_KEY" >> $GITHUB_ENV

      - name: Create Kubernetes Secrets
        run: |
          kubectl create secret generic gitlab-postgres-secret \
            --from-literal=password='P@ssw0rd123!Gitlab' \
            -n gitlab \
            --dry-run=client -o yaml | kubectl apply -f -

          kubectl create secret generic gitlab-redis-secret \
            --from-literal=password="$REDIS_KEY" \
            -n gitlab \
            --dry-run=client -o yaml | kubectl apply -f -

          kubectl create secret generic gitlab-storage-secret \
            --from-literal=connection="DefaultEndpointsProtocol=https;AccountName=$STORAGE_ACCOUNT;AccountKey=$STORAGE_KEY;EndpointSuffix=core.windows.net" \
            -n gitlab \
            --dry-run=client -o yaml | kubectl apply -f -

          kubectl create secret generic gitlab-gitlab-initial-root-password \
            --from-literal=password='GitlabRoot@123' \
            -n gitlab \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Install Helm
        run: |
          curl -fsSL https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3 | bash

      - name: Add GitLab Repo
        run: |
          helm repo add gitlab https://charts.gitlab.io
          helm repo update

      # IMPORTANT FIX
      - name: Cleanup Old GitLab Release
        run: |
          helm uninstall gitlab -n gitlab || true
          kubectl delete namespace gitlab --ignore-not-found=true
          sleep 30
          kubectl create namespace gitlab

      - name: Recreate Kubernetes Secrets
        run: |
          kubectl create secret generic gitlab-postgres-secret \
            --from-literal=password='P@ssw0rd123!Gitlab' \
            -n gitlab

          kubectl create secret generic gitlab-redis-secret \
            --from-literal=password="$REDIS_KEY" \
            -n gitlab

          kubectl create secret generic gitlab-storage-secret \
            --from-literal=connection="DefaultEndpointsProtocol=https;AccountName=$STORAGE_ACCOUNT;AccountKey=$STORAGE_KEY;EndpointSuffix=core.windows.net" \
            -n gitlab

          kubectl create secret generic gitlab-gitlab-initial-root-password \
            --from-literal=password='GitlabRoot@123' \
            -n gitlab

      - name: Install GitLab
        run: |
          helm upgrade --install gitlab gitlab/gitlab \
            --namespace gitlab \
            --create-namespace \
            -f helm/values.yaml \
            --timeout 90m \
            --wait

      - name: Reconnect AKS After Helm
        if: always()
        run: |
          az aks get-credentials \
            --resource-group rg-gitlab \
            --name aks-gitlab-eip \
            --overwrite-existing

      - name: Verify Cluster Connection
        if: always()
        run: |
          kubectl cluster-info
          kubectl get nodes

      - name: Check GitLab Pods
        if: always()
        run: |
          kubectl get pods -n gitlab -o wide

      - name: Describe GitLab Pods
        if: always()
        run: |
          kubectl describe pods -n gitlab

      - name: Get Failed Pod Logs
        if: always()
        run: |
          for pod in $(kubectl get pods -n gitlab --no-headers | awk '$3!="Running" && $3!="Completed" {print $1}'); do
            echo "========== Logs for $pod =========="
            kubectl logs $pod -n gitlab --all-containers=true || true
          done

      - name: Check GitLab Services
        if: always()
        run: |
          kubectl get svc -n gitlab

      - name: Check GitLab Ingress
        if: always()
        run: |
          kubectl get ingress -n gitlab

      - name: Apply Ingress
        if: always()
        run: |
          if [ -f k8s/ingress.yaml ]; then
            kubectl apply -f k8s/ingress.yaml --validate=false
          fi